name: Keep Supabase awake

# Free Supabase projects pause after a week without traffic. A tiny read every
# three days keeps the database ready. Uses only the public publishable key.
on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: https://mozlhxaatyviyqqvkwut.supabase.co
          SUPABASE_KEY: sb_publishable_ZaZI2MXHZ1yXz__u2dY67A_1PquJmve
        run: |
          curl --fail --silent --show-error --retry 3 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keep_alive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}'
